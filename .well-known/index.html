  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      padding: 48px 32px;
      max-width: 420px;
      width: 100%;
    }
    .logo {
      width: 160px;
      height: 160px;
      object-fit: contain;
    }
    .group-name {
      font-size: 22px;
      color: #4fc3f7;
      text-align: center;
      letter-spacing: 0.3px;
      line-height: 1.3;
    }
    .install-text {
      font-size: 20px;
      color: #ffffff;
      text-align: center;
      letter-spacing: 0.2px;
    }
    .install-en {
      font-size: 15px;
      color: #aaaaaa;
      text-align: center;
      margin-top: -18px;
    }
    .play-badge {
      width: 220px;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s;
      filter: drop-shadow(0 4px 16px #00000088);
    }
    .play-badge:hover {
      transform: scale(1.05);
      filter: drop-shadow(0 4px 24px #4fc3f7aa);
    }
    .play-badge:active { transform: scale(0.97); }
  </style>
